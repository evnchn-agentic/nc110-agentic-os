[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = ["-C", "relocation-model=static", "-C", "link-arg=-zmax-page-size=0x1000", "--cfg", "getrandom_backend=\"custom\"",
    # soft-float target: SIMD crypto backends make rustc/LLVM abort (SIGTRAP), force portable ones
    "--cfg", "curve25519_dalek_backend=\"serial\"", "--cfg", "poly1305_backend=\"soft\"", "--cfg", "chacha20_force_soft", "--cfg", "aes_backend=\"soft\"", "--cfg", "sha2_backend=\"soft\""]

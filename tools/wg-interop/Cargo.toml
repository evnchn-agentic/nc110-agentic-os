[package]
name = "wg-interop"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Host harness: compiles the kernel's own src/wg.rs (unchanged) against stubs of the modules it calls, and talks to
# Linux kernel WireGuard over a real UDP socket. Same pinned versions as the kernel.
[dependencies]
smoltcp = { version = "=0.14.0", default-features = false, features = ["medium-ip", "proto-ipv4", "socket-tcp", "socket-udp", "auto-icmp-echo-reply"] }
heapless = { version = "=0.9.3", default-features = false }
chacha20 = { version = "=0.9.1", default-features = false }
poly1305 = { version = "=0.9.1", default-features = false }
x25519-dalek = { version = "=3.0.0", default-features = false }

[workspace]

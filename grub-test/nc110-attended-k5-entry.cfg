menuentry "nc110-bm-attended-k5-wdtprobe" {
  insmod ext2
  search --no-floppy --fs-uuid --set=root c0954bc7-86a0-440c-8401-2c3e95549743
  terminal_output console
  set gfxpayload=text
  insmod multiboot
  echo "nc110-bm: loading /baremetal/k-attended-54d2497b.elf (UDP log to 5514)"
  multiboot /baremetal/k-attended-54d2497b.elf wdt=probe
  boot
}

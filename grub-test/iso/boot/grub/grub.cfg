# M0.5 q35 rehearsal of the M1 arming sequence (shared body: grub-test/tco-arm.cfg, copied here).
# q35 addresses: PMBASE 0x600 -> TCOBASE 0x660, RCBA 0xfed1c000. mode.cfg picks good / badrcba.
set timeout=0
serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console
# Same shape as the M1 file: constants in a function that also sources the shared body.
function q35_tco_consts {
  insmod iorw
  insmod memrw
  insmod setpci
  insmod regexp
  source /boot/grub/tco-arm.cfg
  set lpc_expect=29188086
  set pmbase_expect=601
  set rcba_expect=fed1c001
  source /boot/grub/mode.cfg
  set gcs_addr=0xfed1f410
  set smi_en=0x630
  set tco_rld=0x660
  set tco1_sts=0x664
  set tco2_sts=0x666
  set tco1_cnt=0x668
  set tco_tmr=0x672
  set tmr_val=5
  set tmr_re='^(([0-9a-f]*[048c])?0)?5$'
}
menuentry "wdt-arm then multiboot (q35 rehearsal)" {
  q35_tco_consts
  # Rehearsal only: emulate firmware that left NO_REBOOT set (QEMU powers up with it clear).
  write_dword 0xfed1f410 0x20 0x20
  # ... and a halted TCO timer (QEMU, like the NC110 BIOS, powers up with it running), so un-halting is exercised.
  outw 0x668 0x0800 0x0800
  tco_arm
  if [ "$wdt_ok" = "yes" ]; then
    echo "grub: armed and verified, loading kernel"
    insmod multiboot
    multiboot /boot/k.elf wdt=hang
    boot
  else
    echo "grub: NOT armed, refusing to boot our code, rebooting"
    sleep 3
    reboot
  fi
}

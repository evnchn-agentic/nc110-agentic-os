# Appended to the NC110 /boot/grub/grub.cfg on 2026-10-17 (evnchn at the machine). Booted ONLY via next_entry.
# The TCO is not a safety net on this board (step 1: expiry hangs it dark), so evnchn's power cycle is.
menuentry "nc110-bm-step0-oneshot-probe" {
  echo "step0: one-shot probe, nothing armed, rebooting in 10 s"
  sleep 10
  reboot
}
menuentry "nc110-bm-attended-k1" {
  insmod ext2
  search --no-floppy --fs-uuid --set=root c0954bc7-86a0-440c-8401-2c3e95549743
  terminal_output console
  set gfxpayload=text
  insmod multiboot
  echo "nc110-bm: loading /baremetal/k-attended-2fa72b86.elf"
  multiboot /baremetal/k-attended-2fa72b86.elf
  boot
}

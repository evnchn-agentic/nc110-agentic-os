# M2.5 rehearsal of the hardware key path on QEMU `-machine pc` (no TCO here): real GRUB 2.06 `multiboot` +
# `module`. The key file sits next to the kernel, as it would on the NC110's /boot (/baremetal/<name>).
set timeout=0
serial --unit=0 --speed=115200
terminal_output console serial
menuentry "nc110-m25-keymod" {
  insmod multiboot
  multiboot /boot/k.elf
  module /boot/nc110-client.key
  boot
}

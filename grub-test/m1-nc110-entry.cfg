# PROPOSED M1 entries for the NC110 (NM10 8086:27bc, iTCO v2). UNTESTED ON HARDWARE.
# The shared arm+verify body (tco-arm.cfg) is the one QEMU-tested on q35 (proof/wdt-grub.log); only the
# constants below differ. Copy tco-arm.cfg to /baremetal/tco-arm.cfg (paths are relative to the GRUB root; spec uses /baremetal/). Add these as NEW entries with NEW
# names (spec rule 3) and boot each ONLY via next_entry from Slot A (rule 2). Run the steps in order; stop on any surprise.
# Before step 1, read in Slot A (read-only) and confirm the three guard strings:
#   sudo setpci -s 00:1f.0 0.l 40.l f0.l   -> expect 27bc8086 / 00001001 / fed1c001 (GRUB prints 1001, no padding)
#   and that TCO1_CNT (0x1068) has bit 12 TCO_LOCK = 0 (else the entry refuses, by design).
#   2026-10-17: the NC110 BIOS 01VG.M013 sets TCO_LOCK=1 with TCO_EN=1 (~/party/nc110-m1/M1-RESULT.md), so these
#   entries refuse as written. The lock_mode line in nc110_tco_consts stays commented out until the Linux-side
#   test (pane brief step 1) shows a reset at ~2x the heartbeat. Rehearsed on q35: proof/wdt-grub-locked-*.log.

# Step 0: prove the one-shot itself. Arms nothing, runs none of our code, reboots. Pass = Slot A comes back
# by itself and grubenv next_entry is empty afterwards.
menuentry "nc110-bm-step0-oneshot-probe" {
  echo "step0: one-shot probe, nothing armed, rebooting in 10 s"
  sleep 10
  reboot
}

function nc110_tco_consts {
  insmod iorw
  insmod memrw
  insmod setpci
  insmod regexp
  source /baremetal/tco-arm.cfg
  set lpc_expect=27bc8086
  set pmbase_expect=1001
  set rcba_expect=fed1c001
  set gcs_addr=0xfed1f410
  set smi_en=0x1030
  set tco_rld=0x1060
  set tco1_sts=0x1064
  set tco2_sts=0x1066
  set tco1_cnt=0x1068
  set tco_tmr=0x1072
  set tmr_val=0x64
  set tmr_re='^([0-9a-f]*[048c])?64$'
  # set lock_mode=accept   # ONLY after step 1 reset at ~2x heartbeat on THIS board (firmware SMI does not swallow)
}

# Step 1: the watchdog proof proper. Pinned grub-armed kernel (cargo --features grub-armed, record its sha256),
# deliberate hang. TMR 0x64 = 100 x 0.6 s = 60 s per stage, so reset ~120 s after arming. Pass = "HANG now"
# on screen, reset within ~150 s, Slot A back unaided, then (Linux) TCO2_STS at 0x1066 reads SECOND_TO_STS|BOOT_STS
# if firmware has not cleared it.
menuentry "nc110-bm-step1-wdt-hang" {
  terminal_output console
  set gfxpayload=text
  nc110_tco_consts
  tco_arm
  if [ "$wdt_ok" = "yes" ]; then
    echo "wdt: armed and verified, ~120 s to reset; loading k-wdt-hang.elf"
    sleep 3
    insmod multiboot
    multiboot /baremetal/k-wdt-hang.elf wdt=hang
    boot
  else
    echo "wdt: NOT armed, refusing to boot our code, rebooting to Slot A"
    sleep 10
    reboot
  fi
}

# Step 2 (only after step 1 passed): iPXE + DHCP + syslog to .179. iPXE does not pet, so the board returns
# to Slot A ~120 s after arming whatever iPXE does. Pin ipxe.lkrn (sha256) and its embedded script.
menuentry "nc110-bm-step2-ipxe" {
  terminal_output console
  set gfxpayload=text
  nc110_tco_consts
  tco_arm
  if [ "$wdt_ok" = "yes" ]; then
    echo "wdt: armed and verified, loading iPXE"
    sleep 3
    linux16 /baremetal/ipxe.lkrn
    boot
  else
    echo "wdt: NOT armed, refusing to boot iPXE, rebooting to Slot A"
    sleep 10
    reboot
  fi
}

